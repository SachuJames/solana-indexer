services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: solana_indexer
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  indexer:
    build: ./indexer
    environment:
      DATABASE_URL: postgresql://indexer:indexer@postgres:5432/solana_indexer
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      BACKFILL: 1
    depends_on:
      - postgres

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://indexer:indexer@postgres:5432/solana_indexer
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  dashboard:
    build: ./dashboard
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
